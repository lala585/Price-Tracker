name: RV Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "22 04 * * *"
    - cron: '20 20 * * *'

concurrency:
  group: rv-price-tracker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download private database from Cloud Storage
        run: |
          mkdir -p rv_price_tracker
          gcloud storage cp gs://rvsearchbucket/rv_tracker.db rv_price_tracker/rv_tracker.db || true

      - name: Run RV price tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rv_price_tracker/rv_tracker_playwright.py

      - name: Upload updated database to Cloud Storage
        run: |
          gcloud storage cp rv_price_tracker/rv_tracker.db gs://rvsearchbucket/rv_tracker.db
