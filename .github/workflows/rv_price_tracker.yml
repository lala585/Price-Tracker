name: RV Price Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "22 04 * * *"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip playwright beautifulsoup4 requests

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run RV price tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rv_tracker_playwright.py

      - name: Upload CSV history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv-price-history
          path: rv_price_history.csv
          if-no-files-found: warn
