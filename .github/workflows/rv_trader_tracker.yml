name: RVTrader Tracker

on:
  schedule:
    # Runs twice a day (at 06:42 and 18:42 UTC)
    - cron: '42 6 * * *'
    - cron: '42 18 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab in GitHub

concurrency:
  group: rv-tracker
  cancel-in-progress: false # Ensure runs do not overlap and corrupt the DB

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Sized for catalog volume and pacing

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests

      - name: Install Playwright Chromium & system dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download private database from Cloud Storage
        run: |
          # Download the database if it exists; continue if it is the first run
          gcloud storage cp gs://rvsearchbucket/rvtrader_tracker.db rv_trader_search/rvtrader_tracker.db || true

      - name: Run Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python rv_trader_search/rv_trader_search.py

      - name: Upload updated database to Cloud Storage
        run: |
          gcloud storage cp rv_trader_search/rvtrader_tracker.db gs://rvsearchbucket/rvtrader_tracker.db